name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build release archive
        run: bash scripts/build-release.sh "${GITHUB_REF_NAME}" "${GITHUB_REPOSITORY}"
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-release/eskadra.tar.gz
            dist-release/eskadra.tar.gz.sha256
            dist-release/install.sh
